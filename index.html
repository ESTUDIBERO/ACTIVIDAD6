<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero ODS Sostenibilidad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral gris oscuro (como el bloque gris de la plantilla) + lienzo claro con franja naranja superior, rótulos azules y tarjetas blancas sobre gris claro. */
:root{
  --bg:#eceef1; --surface:#ffffff; --surface-2:#f4f5f7; --ink:#1c2530; --muted:#5b6672; --line:#dde1e6;
  --blue:#004F9E; --mark:#004F9E; --mark-soft:#8fb2d8; --orange:#EE8905; --side:#5f6062; --side-ink:#f2f3f4;
  --good:#1d7a4d; --warn:#b36b00; --crit:#b3261e; --card-a:.9; --glow-a:rgba(0,79,158,.16); --glow-b:rgba(238,137,5,.16);
  --f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d151f; --surface:#17212d; --surface-2:#1e2a38; --ink:#e9eef4; --muted:#9eabb8; --line:#2b3948;
  --blue:#6aa9ff; --mark:#5b9fee; --mark-soft:#2c527f; --orange:#f59d2b; --side:#1a232e; --side-ink:#eef1f4;
  --good:#52c38a; --warn:#f0b24a; --crit:#ff8a80; --glow-a:rgba(91,159,238,.14); --glow-b:rgba(245,157,43,.1);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d151f; --surface:#17212d; --surface-2:#1e2a38; --ink:#e9eef4; --muted:#9eabb8; --line:#2b3948;
  --blue:#6aa9ff; --mark:#5b9fee; --mark-soft:#2c527f; --orange:#f59d2b; --side:#1a232e; --side-ink:#eef1f4;
  --good:#52c38a; --warn:#f0b24a; --crit:#ff8a80; --glow-a:rgba(91,159,238,.14); --glow-b:rgba(245,157,43,.1);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;margin:0}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg .orb{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 28s ease-in-out infinite alternate}
#bg .o1{width:46vw;height:46vw;left:-8vw;top:-10vw;background:var(--glow-a)}
#bg .o2{width:40vw;height:40vw;right:-6vw;top:20vh;background:var(--glow-b);animation-duration:34s}
#bg .o3{width:36vw;height:36vw;left:30vw;bottom:-14vw;background:var(--glow-a);animation-duration:40s}
@keyframes drift{to{transform:translate(6vw,4vw) scale(1.12)}}
#cv{position:absolute;inset:0;width:100%;height:100%}
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:0 0 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-top:6px solid var(--orange)}
.brand{padding:22px 20px 14px}
.brand small{display:block;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;opacity:.75;font-weight:600}
.brand b{display:block;font-size:20px;font-weight:800;line-height:1.15;margin-top:6px}
.chip-cut{display:inline-block;margin-top:12px;background:#004F9E;color:#fff;font-weight:700;font-size:11px;padding:6px 10px;letter-spacing:.04em;line-height:1.3}
nav{display:flex;flex-direction:column;gap:2px;padding:10px 10px;flex:1;overflow:auto}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:11px 12px;font-weight:600;font-size:13.5px;opacity:.8;border-left:3px solid transparent;transition:background .2s,opacity .2s,border-color .2s}
nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:rgba(255,255,255,.08);opacity:1}
nav button[aria-selected=true]{opacity:1;background:rgba(255,255,255,.12);border-left-color:var(--orange)}
nav button:focus-visible,.btn:focus-visible,select:focus-visible,.fb summary:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.side .foot{padding:0 20px;font-size:11.5px;opacity:.7}
.main{min-width:0;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px 0 10px}
.top h1{margin:0;font-size:26px;font-weight:800;color:var(--blue);letter-spacing:-.01em;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.btn{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:8px 13px;font-weight:600;font-size:12.5px;color:var(--ink);transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--orange)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
:root[data-theme="dark"] .btn.pri,:root:not([data-theme="light"]) .btn.pri{color:#06121f}
.filters{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 0;border-bottom:1px solid var(--line)}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{position:relative}
.fb summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 11px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.fb summary::-webkit-details-marker{display:none}
.fb summary::after{content:"";width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.fb[open] summary{border-color:var(--orange)}
.fb .badge{background:var(--orange);color:#1b1200;font-size:10.5px;border-radius:9px;padding:0 6px;font-weight:800}
.fb .pop{position:absolute;top:calc(100% + 4px);left:0;min-width:240px;max-width:78vw;background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.18);padding:8px;max-height:320px;overflow:auto;z-index:30}
.pop label{display:flex;gap:8px;align-items:center;padding:5px 6px;cursor:pointer;font-size:12.5px}
.pop label:hover{background:var(--surface-2)}
.pop label em{margin-left:auto;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
.pop input{accent-color:var(--blue)}
.active{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:12px;color:var(--muted)}
.tag{background:var(--blue);color:#fff;padding:3px 4px 3px 9px;font-weight:600;display:inline-flex;gap:6px;align-items:center;font-size:12px}
:root[data-theme="dark"] .tag,:root:not([data-theme="light"]) .tag{color:#06121f}
.tag button{all:unset;cursor:pointer;padding:0 5px;font-weight:800}
.tag button:focus-visible{outline:2px solid var(--orange)}
.count{font-weight:700;color:var(--ink)}
section.view{display:none;padding-top:18px}
section.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);background:var(--surface);overflow:hidden;margin-bottom:16px;border-top:5px solid var(--orange)}
.hero .img{background-size:cover;background-position:center;min-height:190px}
.hero .txt{padding:22px 24px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.hero .txt b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero .txt h2{margin:0;color:var(--blue);font-size:22px;line-height:1.2;text-wrap:balance}
.hero .txt p{margin:0;color:var(--muted)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.card{background:color-mix(in srgb,var(--surface) calc(var(--card-a)*100%),transparent);backdrop-filter:blur(6px);padding:16px 18px;min-width:0;border:1px solid var(--line)}
.card h3{margin:0;font-size:14.5px;font-weight:700;color:var(--ink)}
.card .sub{font-size:12px;color:var(--muted);margin:2px 0 10px;text-wrap:pretty}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mini{all:unset;cursor:pointer;font-size:11px;font-weight:700;color:var(--blue);border:1px solid var(--line);padding:3px 8px;white-space:nowrap}
.mini:hover{border-color:var(--orange)}
.mini:focus-visible{outline:2px solid var(--orange)}
.kpi{border-left:5px solid var(--blue);display:flex;flex-direction:column;gap:2px;cursor:default;transition:transform .2s,border-color .2s}
.kpi:hover{transform:translateY(-2px);border-left-color:var(--orange)}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:30px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v.t{font-size:17px;line-height:1.25;padding:5px 0}
.kpi .d{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.d.up{color:var(--good)}.d.dn{color:var(--crit)}.d.eq{color:var(--muted)}
.kpi .n{font-size:11.5px;color:var(--muted)}
.cw{position:relative;width:100%}
.cw canvas{max-width:100%}
.tbl{overflow:auto;max-height:340px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:700;font-size:11.5px;position:sticky;top:0;background:var(--surface)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.stats b{color:var(--ink)}
.ctl{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;align-items:end}
.ctl label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:200px;max-width:100%}
.heat td{padding:0;border:2px solid var(--surface);text-align:center}
.heat td.c{cursor:pointer;height:34px;min-width:58px;font-weight:600;font-size:12px}
.heat td.c:hover{outline:2px solid var(--orange);outline-offset:-2px}
.heat th.r{text-align:left;max-width:230px;font-size:12px;color:var(--ink);font-weight:600;white-space:normal;background:var(--surface)}
.heat th.cc{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;height:150px;font-size:11.5px;white-space:nowrap;padding:6px 2px}
.tt{position:fixed;z-index:100;pointer-events:none;background:#101923;color:#fff;padding:9px 11px;font-size:12px;max-width:290px;box-shadow:0 8px 24px rgba(0,0,0,.35);border-left:4px solid var(--orange);display:none;line-height:1.4}
.tt b{display:block;margin-bottom:2px}
.concl{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.concl .card ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:9px}
.concl .card li{text-wrap:pretty}
.concl .card.al{border-top:4px solid var(--crit)}.concl .card.hf{border-top:4px solid var(--blue)}.concl .card.rc{border-top:4px solid var(--orange)}
.concl h3 .ic{display:inline-block;width:10px;height:10px;margin-right:8px}
.note{font-size:12px;color:var(--muted);margin-top:14px;text-wrap:pretty}
.emp{padding:30px;text-align:center;color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;font-size:11px;font-weight:700;margin-left:6px}
.pill.w{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;z-index:40;border-top:5px solid var(--orange);padding:0;overflow:hidden}
  .brand{display:none}.side .foot{display:none}
  nav{flex-direction:row;overflow-x:auto;padding:4px 6px;gap:0}
  nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:11px 10px}
  nav button[aria-selected=true]{border-bottom-color:var(--orange)}
  .hero{grid-template-columns:1fr}.top h1{font-size:21px}
  .filters{top:48px}
}
@media (prefers-reduced-motion:reduce){#bg .orb{animation:none}section.view.on{animation:none}*{transition:none!important}}
</style>

<div id="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><canvas id="cv"></canvas></div>
<div class="app">
  <aside class="side">
    <div class="brand"><small>Encuesta de percepción</small><b>Sostenibilidad y ODS</b><span class="chip-cut">OBJETIVOS DE DESARROLLO SOSTENIBLES</span></div>
    <nav id="nav" role="tablist" aria-label="Secciones del tablero"></nav>
    <div class="foot" id="sideFoot"></div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="ttl">Resumen ejecutivo</h1><p id="sub"></p></div>
      <div class="frow"><button class="btn" id="themeBtn" type="button">Cambiar tema</button></div>
    </header>
    <div class="filters" id="filters">
      <div class="frow" id="fbar"></div>
      <div class="active" id="active"></div>
    </div>
    <section class="view" id="v-resumen"></section>
    <section class="view" id="v-perfil"></section>
    <section class="view" id="v-segmentos"></section>
    <section class="view" id="v-ods"></section>
    <section class="view" id="v-actores"></section>
    <section class="view" id="v-cruces"></section>
    <section class="view" id="v-conclusiones"></section>
  </main>
</div>
<div class="tt" id="tt" role="tooltip"></div>

const F={}; // k -> Set(codes)
let idx=[], TAB='resumen';
function compute(excl){ const ks=Object.keys(F).filter(k=>F[k].size&&k!==excl); const out=[];
  for(let i=0;i<N;i++){let ok=true;for(const k of ks){if(!F[k].has(COLS[k][i])){ok=false;break}} if(ok)out.push(i)} return out }
function counts(k,list){const c=new Array(DIC[k].length).fill(0),a=COLS[k];for(const i of list)c[a[i]]++;return c}
const base=KEYS.reduce((o,k)=>(o[k]=counts(k,[...Array(N).keys()]),o),{});
function toggle(k,c){const s=F[k]||(F[k]=new Set());s.has(c)?s.delete(c):s.add(c);if(!s.size)delete F[k];refresh()}
function setOnly(k,c){F[k]=new Set([c]);refresh()}
function clearAll(){for(const k in F)delete F[k];refresh()}

/* metricas */
function share(k,label,list,c){ c=c||counts(k,list); const sr=DIC[k].indexOf(SR); const tot=c.reduce((a,b)=>a+b,0)-(sr>=0?c[sr]:0); const i=DIC[k].indexOf(label); return tot?c[i]/tot:0 }

 conoce:{n:'Conocen completamente el desarrollo sostenible',k:'conoce',l:'Completamente'},

function topN(k,list,n=1){const c=counts(k,list),sr=DIC[k].indexOf(SR);return c.map((v,i)=>({i,v,l:DIC[k][i]})).filter(o=>o.i!==sr).sort((a,b)=>b.v-a.v).slice(0,n)}

/* tarjeta de variable con grafico de barras horizontales clicable + tabla */
const TBLMODE={};
function varCard(host,k,opts={}){
  const id='c_'+host.id+'_'+k; const cats=DIC[k]; const c=counts(k,idx); const tot=idx.length;
  const el=document.createElement('div');el.className='card';
  const sr=cats.indexOf(SR); const valid=tot-(sr>=0?c[sr]:0);
  let order=cats.map((_,i)=>i); if(opts.sort)order.sort((a,b)=>(a===sr)-(b===sr)||c[b]-c[a]);
  const nz=order.filter(i=>c[i]>0);
  const mx=nz.reduce((a,i)=>c[i]>c[a]?i:a,nz[0]),mn=nz.reduce((a,i)=>c[i]<c[a]&&i!==sr?i:a,nz.find(i=>i!==sr)??nz[0]);
  el.innerHTML=`<div class="hd"><div><h3>${LBL[k]}</h3><div class="sub">${Q[k]}</div></div><button class="mini" type="button">Ver tabla</button></div>
   <div class="cw" style="height:${Math.max(120,order.length*(opts.row||27)+22)}px"><canvas id="${id}" role="img" aria-label="${LBL[k]}"></canvas></div>
   <div class="tbl" hidden></div>
   <div class="stats">${nz.length?`<span>Mayor: <b>${catLabel(k,cats[mx])}</b> (${pf(c[mx]/tot)})</span><span>Menor: <b>${catLabel(k,cats[mn])}</b> (${pf(c[mn]/tot)})</span>`:'<span>Sin datos en la selección</span>'}<span>Respuestas válidas: <b>${fmt(valid)}</b></span></div>`;
  host.appendChild(el);
  const tb=el.querySelector('.tbl'),cw=el.querySelector('.cw'),btn=el.querySelector('.mini');
  tb.innerHTML=`<table><thead><tr><th>Categoría</th><th>Personas</th><th>% selección</th><th>% total base</th></tr></thead><tbody>${order.map(i=>`<tr><td>${catLabel(k,cats[i])}</td><td>${fmt(c[i])}</td><td>${tot?pf(c[i]/tot):'—'}</td><td>${pf(base[k][i]/N)}</td></tr>`).join('')}<tr><th>Total</th><th>${fmt(tot)}</th><th>100,0%</th><th>100,0%</th></tr></tbody></table>`;
  const showT=!!TBLMODE[id];tb.hidden=!showT;cw.hidden=showT;btn.textContent=showT?'Ver gráfico':'Ver tabla';
  btn.onclick=()=>{TBLMODE[id]=!TBLMODE[id];tb.hidden=!TBLMODE[id];cw.hidden=TBLMODE[id];btn.textContent=TBLMODE[id]?'Ver gráfico':'Ver tabla'};
  const sel=F[k]; const {tc,gc}=baseOpts(); const mark=css('--mark'),or=css('--orange');
  const ord=opts.ordinal; // azul secuencial
  const colors=order.map((i,j)=>{ let col=mark; if(ord){const t=ord.length>1?1-i/(Math.max(cats.length-1,1)):1;col=mixHex(css('--mark-soft'),mark,Math.min(1,.25+t*.75))} if(i===sr)col=css('--muted'); if(sel&&sel.size)col=sel.has(i)?or:alphaHex(col,.4); return col});
  mk(id,{type:'bar',data:{labels:order.map(i=>catLabel(k,cats[i])),datasets:[{data:order.map(i=>c[i]),backgroundColor:colors,borderRadius:{topRight:4,bottomRight:4},barThickness:opts.thick||16}]},
   options:{indexAxis:'y',maintainAspectRatio:false,responsive:true,layout:{padding:{right:92}},animation:{duration:450},
    onHover:(e,a)=>{e.native.target.style.cursor=a.length?'pointer':'default'},
    onClick:(e,a)=>{if(a.length)toggle(k,order[a[0].index])},
    scales:{x:{grid:{color:gc},ticks:{color:tc,font:{size:11},callback:v=>fmt(v)},border:{display:false},beginAtZero:true},y:{grid:{display:false},ticks:{color:css('--ink'),font:{size:11.5},callback(v){const l=this.getLabelForValue(v);return l.length>40?l.slice(0,39)+'…':l}},border:{color:gc}}},
    plugins:{legend:{display:false},valLabels:{on:true,text:j=>{const i=order[j];return c[i]?`${fmt(c[i])} · ${pf(c[i]/tot)}`:''}},
     tooltip:tip(p=>{const i=order[p.dataIndex];return `<b>${catLabel(k,cats[i])}</b>${fmt(c[i])} personas<br>${pf(tot?c[i]/tot:0)} de la selección<br>${pf(base[k][i]/N)} del total (${fmt(base[k][i])})<br><span style="opacity:.7">Clic para filtrar</span>`})}},plugins:[valLabels]});
  return el}
function mixHex(a,b,t){const pa=hx(a),pb=hx(b);return '#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function alphaHex(h,a){const p=hx(h);return `rgba(${p[0]},${p[1]},${p[2]},${a})`}

  const bar=document.getElementById('fbar');bar.innerHTML='';

function renderConclusiones(){
  const h=document.getElementById('v-conclusiones');
  const n=idx.length; if(n<30){h.innerHTML='<div class="card emp">La selección tiene menos de 30 respuestas. Amplíe los filtros para generar conclusiones confiables.</div>';return}
  const filtered=Object.keys(F).length>0;
  const cK=mval('conoce',idx),cC=mval('capac',idx),cM=mval('mide',idx),cMe=mval('metas',idx),cN=mval('nosabe',idx);
  const pu=topN('urgente',idx,3),pr=topN('relev',idx,3),pp=topN('preocup',idx,3),ac=topN('actor',idx,2),me=topN('medidas',idx,3),de=topN('decis',idx,3);
  const sh=(k,l)=>pf(l.v/(idx.filter(()=>1).length-counts(k,idx)[DIC[k].indexOf(SR)]||1),0);
  const P=odsShare('preocup',idx),R=odsShare('relev',idx),U=odsShare('urgente',idx);const gap=U.map((u,i)=>[i,(u-R[i])*100]).sort((a,b)=>b[1]-a[1]);
  // segmentos extremos
  const seg=(dk,m)=>DIC[dk].map((l,i)=>{const lst=idx.filter(j=>COLS[dk][j]===i);return{l,n:lst.length,v:lst.length?mval(m,lst):0}}).filter(r=>r.n>=30&&r.l!==SR);
  const lowK=['estamento','sistema','vinc','edad'].map(dk=>{const s=seg(dk,'conoce');if(s.length<2)return null;const lo=s.reduce((a,r)=>r.v<a.v?r:a),hi=s.reduce((a,r)=>r.v>a.v?r:a);return{dk,lo,hi}}).filter(Boolean);
  const wk=lowK.sort((a,b)=>(b.hi.v-b.lo.v)-(a.hi.v-a.lo.v))[0];
  const lowC=['estamento','sistema'].map(dk=>{const s=seg(dk,'capac');if(s.length<2)return null;return{dk,lo:s.reduce((a,r)=>r.v<a.v?r:a)}}).filter(Boolean).sort((a,b)=>a.lo.v-b.lo.v)[0];
  const lowM=['estamento','sistema'].map(dk=>{const s=seg(dk,'mide');if(s.length<2)return null;return{dk,lo:s.reduce((a,r)=>r.v<a.v?r:a)}}).filter(Boolean).sort((a,b)=>a.lo.v-b.lo.v)[0];
  const ctx=filtered?'En la selección actual':'En el conjunto de la base';
  const find=[],al=[],rec=[];
  find.push(`${ctx} (${fmt(n)} respuestas), ${pf(cK,0)} afirma conocer completamente el desarrollo sostenible, ${pf(1-cK-cN,0)} tiene solo una idea del concepto y ${pf(cN,0)} no sabe qué es.`);
  find.push(`Para la urgencia política, los ODS más votados son ${pu.map(o=>`${o.l} (${pf(o.v/n,0)})`).join(', ')}. Para la relevancia en la organización: ${pr.map(o=>`${o.l} (${pf(o.v/n,0)})`).join(', ')}. En la preocupación personal y familiar: ${pp.map(o=>`${o.l} (${pf(o.v/n,0)})`).join(', ')}.`);
  find.push(`El actor más señalado para impulsar los ODS es ${ac[0].l.toLowerCase()} (${pf(ac[0].v/n,0)}), seguido de ${ac[1].l.toLowerCase()} (${pf(ac[1].v/n,0)}).`);
  find.push(`La medida más respaldada es «${me[0].l.toLowerCase()}» (${pf(me[0].v/n,0)}) y la variable que más pesa en las decisiones es «${de[0].l.toLowerCase().replace(/^politicas/,'políticas').replace(/^acciones/,'acciones')}» (${pf(de[0].v/n,0)}).`);
  find.push(`${pf(cMe,0)} relaciona las acciones con los ODS por sus metas y el resto solo por el nombre del objetivo.`);
  if(wk)find.push(`La mayor diferencia de conocimiento está en ${LBL[wk.dk].toLowerCase()}: ${wk.hi.l} (${pf(wk.hi.v,0)}) frente a ${wk.lo.l} (${pf(wk.lo.v,0)}), una distancia de ${((wk.hi.v-wk.lo.v)*100).toFixed(0)} puntos.`);
  if(cK-cC>.15)al.push(`Brecha entre saber y formarse: ${pf(cK,0)} dice conocer el tema a fondo, pero solo ${pf(cC,0)} recibió capacitación de la organización en ODS.`);
  if(cM<.5)al.push(`Solo ${pf(cM,0)} cree que la organización mide su progreso en sostenibilidad; la mayoría no ve indicadores relevantes.`);
  if(cN+(1-cK-cN)>.4)al.push(`${pf(1-cK,0)} no domina el concepto (idea parcial o desconocimiento), lo que limita la apropiación de los ODS.`);
  const g0=gap[0],g1=gap[1];al.push(`Mayor distancia entre urgencia y relevancia: ODS ${g0[0]+1} (${ODSN[g0[0]]}) con +${g0[1].toFixed(0)} pp y ODS ${g1[0]+1} (${ODSN[g1[0]]}) con +${g1[1].toFixed(0)} pp; se perciben urgentes en el país pero poco presentes en la agenda de la organización.`);
  if(lowC)al.push(`La menor cobertura de capacitación está en ${lowC.lo.l} (${pf(lowC.lo.v,0)}, n=${fmt(lowC.lo.n)}).`);
  if(lowM&&lowM.lo.v<cM-.05)al.push(`${lowM.lo.l} es el grupo que menos percibe medición de la sostenibilidad (${pf(lowM.lo.v,0)}).`);
  const lg=gap[16];al.push(`Sobredimensionado frente a la urgencia: ODS ${lg[0]+1} (${ODSN[lg[0]]}) es más relevante para la organización que urgente para la política pública (${lg[1].toFixed(0)} pp).`);
  rec.push(`Lanzar un programa de formación en ODS priorizando ${lowC?lowC.lo.l.toLowerCase():'los grupos con menor cobertura'}${wk?' y '+wk.lo.l.toLowerCase():''}, con contenidos por metas y no solo por nombre del objetivo.`);
  rec.push(`Definir y publicar indicadores internos de sostenibilidad con reporte periódico, para cerrar la brecha entre lo que se hace y lo que se percibe (${pf(cM,0)} percibe medición).`);
  rec.push(`Integrar la sostenibilidad en la agenda institucional, la medida con mayor respaldo (${pf(me[0].v/n,0)}), con metas, responsables y seguimiento.`);
  rec.push(`Revisar si el ODS ${g0[0]+1} y el ODS ${g1[0]+1} deben entrar al portafolio de iniciativas, dado que los participantes los ven como urgentes.`);
  rec.push(`Articular con ${ac[0].l.toLowerCase()} y ${ac[1].l.toLowerCase()}, los actores a los que se atribuye el liderazgo, en las acciones de alianza.`);
  rec.push(`Repetir la medición con fecha de aplicación para habilitar proyecciones; la base actual no tiene variable temporal y las tendencias se leen por antigüedad y edad.`);
  const li=a=>a.map(x=>`<li>${x}</li>`).join('');
  h.innerHTML=`<div class="concl"><div class="card hf"><h3>Hallazgos principales</h3><ul>${li(find)}</ul></div><div class="card al"><h3>Alertas y puntos críticos</h3><ul>${li(al)}</ul></div><div class="card rc"><h3>Recomendaciones estratégicas</h3><ul>${li(rec)}</ul></div></div>

  <div class="card" style="margin-top:14px"><h3>Calidad de datos y tratamiento</h3><div class="sub">Se procesaron las 15 variables y las ${fmt(N)} filas. Ajustes aplicados: «Sin respuesta.» y «No reporta» unificados como Sin respuesta; 39 casos con «No sé que es» en rango de edad pasaron a Sin respuesta; 5 celdas con error de fórmula (#¿NOMBRE?) pasaron a Sin respuesta en variables de decisión; 4 textos con referencia de celda corrupta se corrigieron a «Políticas frente a acciones de reporte y cumplimiento»; se retiraron puntos finales y espacios sobrantes.</div></div>`;
}
